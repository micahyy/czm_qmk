name: Build Firmware

on:
  push:
    branches: [main, develop]
    paths:
      - 'keyboards/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            gcc-avr binutils-avr avr-libc dfu-util dfu-programmer python3-pip
          pip3 install qmk
          qmk --version || true

      - name: Build EC87 default (bin)
        run: make czmao/ec87:default COLOR=false

      - name: Build EC87 default (UF2)
        run: |
          make czmao/ec87:default:uf2 COLOR=false
          cp -v .build/czmao_ec87_default.uf2 ./czmao_ec87_default.uf2

      - name: Build DS60 default (UF2)
        run: |
          qmk info -kb czmao/ds60
          make czmao/ds60:default:uf2 COLOR=false VERBOSE=1
          ls -la .build/ | grep -i ds60 || true
          cp -v .build/czmao_ds60_default.uf2 ./czmao_ds60_default.uf2 || true

      - name: Build DS60 via (UF2)
        run: |
          make czmao/ds60:via:uf2 COLOR=false
          ls -la .build/ | grep -i ds60 || true
          cp -v .build/czmao_ds60_via.uf2 ./czmao_ds60_via.uf2 || true

      - name: List build outputs
        run: |
          ls -la *.bin *.hex *.uf2 2>/dev/null || echo "None in root"
          ls -la .build/*.bin .build/*.hex .build/*.uf2 2>/dev/null || echo "None in .build"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: czmao_firmware
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error
