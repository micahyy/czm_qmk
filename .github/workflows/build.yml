name: Build Firmware

on:
  push:
    branches: [main, develop]
    paths:
      - 'keyboards/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            gcc-avr binutils-avr avr-libc dfu-util dfu-programmer python3-pip
          pip3 install qmk
          qmk --version || true

      - name: Build EC87 debug
        run: make czmao/ec87:default COLOR=false

      - name: List build outputs
        run: |
          ls -la *.bin *.hex *.uf2 2>/dev/null || echo "None in root"
          ls -la .build/*.bin .build/*.hex .build/*.uf2 2>/dev/null || echo "None in .build"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: czmao_ec87_firmware
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error
