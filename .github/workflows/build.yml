name: Build Test

on:
  push:
    branches: [applo87h]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: onekey/stm32f072
            keymap: default

    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi avr-gcc avr-binutils avr-libc python3-pip
          pip3 install qmk
          qmk --version

      - name: Build firmware
        run: |
          make ${{ matrix.keyboard }}:${{ matrix.keymap }} COLOR=false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keyboard }}_${{ matrix.keymap }}
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: warn
