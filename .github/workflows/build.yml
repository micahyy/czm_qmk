name: Build Firmware

on:
  push:
    branches: [applo87h]
    paths:
      - 'keyboards/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      keyboard:
        description: 'Keyboard path (e.g. czmao/ds17r6)'
        required: true
        default: ''
      keymap:
        description: 'Keymap name'
        required: true
        default: 'default'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            gcc-avr binutils-avr avr-libc dfu-util dfu-programmer python3-pip
          pip3 install qmk
          qmk --version || true

      - name: Determine build target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.keyboard }}" ]; then
            echo "keyboard=${{ github.event.inputs.keyboard }}" >> $GITHUB_OUTPUT
            echo "keymap=${{ github.event.inputs.keymap }}" >> $GITHUB_OUTPUT
          else
            KB=$(find keyboards -name "keyboard.json" | head -1 | xargs dirname | sed 's|^keyboards/||')
            echo "keyboard=$KB" >> $GITHUB_OUTPUT
            echo "keymap=default" >> $GITHUB_OUTPUT
          fi
          echo "Building: ${{ steps.target.outputs.keyboard }}:${{ steps.target.outputs.keymap }}"

      - name: Build firmware
        run: |
          make ${{ steps.target.outputs.keyboard }}:${{ steps.target.outputs.keymap }} COLOR=false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.keyboard }}_${{ steps.target.outputs.keymap }}
          path: |
            .build/*.bin
            .build/*.hex
            .build/*.uf2
          if-no-files-found: error
