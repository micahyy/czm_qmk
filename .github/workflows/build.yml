name: Build Applo87H Firmware

on:
  push:
    branches: [applo87h]
    paths:
      - 'keyboards/applo87h_qmk/**'
      - 'platforms/chibios/mcu_selection.mk'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keymap: [default, via]

    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3-pip
          pip3 install qmk
          qmk --version

      - name: Setup ChibiOS (qmk-master with AT32 support)
        run: |
          rm -rf lib/chibios lib/chibios-contrib lib/googletest lib/printf
          git clone --depth 1 -b qmk-master https://github.com/qmk/ChibiOS.git lib/chibios
          git clone --depth 1 -b qmk-master https://github.com/qmk/ChibiOS-Contrib.git lib/chibios-contrib
          git clone --depth 1 https://github.com/qmk/googletest.git lib/googletest
          git clone --depth 1 https://github.com/qmk/printf.git lib/printf
          echo "=== AT32 port check ==="
          ls lib/chibios-contrib/os/hal/ports/AT32/AT32F402_405/

      - name: Build firmware
        run: |
          make applo87h_qmk:${{ matrix.keymap }} COLOR=false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: applo87h_qmk_${{ matrix.keymap }}
          path: |
            applo87h_qmk_*.bin
            applo87h_qmk_*.hex
            applo87h_qmk_*.uf2
          if-no-files-found: error
