name: Build Firmware

on:
  push:
    branches: [main, develop]
    paths:
      - 'keyboards/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi \
            gcc-avr binutils-avr avr-libc dfu-util dfu-programmer python3-pip
          pip3 install qmk
          qmk --version || true

      - name: Build EC87 default (bin + UF2)
        run: |
          qmk compile -kb czmao/ec87 -km default
          qmk compile -kb czmao/ec87 -km default -e CONVERT_TO=uf2
          cp -v .build/czmao_ec87_default.uf2 ./czmao_ec87_default.uf2

      - name: Build DS60 via (UF2)
        run: |
          qmk compile -kb czmao/ds60 -km via -e CONVERT_TO=uf2
          cp -v .build/czmao_ds60_via.uf2 ./czmao_ds60_via.uf2
          cp -v .build/czmao_ds60_via.bin ./czmao_ds60_via.bin

      - name: List outputs
        run: |
          ls -la *.bin *.hex *.uf2 2>/dev/null || true
          ls -la .build/*ds60* .build/*ec87* 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: czmao_firmware
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error
